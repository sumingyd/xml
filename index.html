<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPG频道信息</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface-2: #1a2236;
            --border: rgba(255,255,255,0.06);
            --text: #e2e8f0;
            --text-dim: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99,102,241,0.15);
            --green: #22c55e;
            --green-dim: rgba(34,197,94,0.12);
            --red: #ef4444;
            --red-dim: rgba(239,68,68,0.12);
            --orange: #f59e0b;
            --orange-dim: rgba(245,158,11,0.12);
            --radius: 12px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .page { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }

        .hero {
            position: relative;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #0c1220 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -60px; left: 30%;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(34,197,94,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 28px; }
        .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
        .btn-dl {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem; font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
        }
        .btn-dl:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
        .btn-dl svg { width: 16px; height: 16px; }
        .hero-urls {
            margin-top: 20px;
            display: flex; flex-direction: column; gap: 6px;
            position: relative; z-index: 1;
        }
        .url-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; color: var(--text-dim);
        }
        .url-row code {
            background: rgba(99,102,241,0.1);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            user-select: all;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: border-color 0.2s;
        }
        .stat-card:hover { border-color: rgba(99,102,241,0.3); }
        .stat-label { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-value.accent { color: var(--accent); }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }

        .category-nav {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .cat-btn {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem; font-weight: 500;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn:hover { border-color: var(--accent); color: var(--text); }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--surface-2);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        thead th.center { text-align: center; }
        tbody td {
            padding: 11px 16px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(99,102,241,0.04); }
        .td-center { text-align: center; }
        .td-index {
            color: var(--text-dim);
            font-size: 0.78rem;
            font-weight: 500;
            width: 50px;
            text-align: center;
        }
        .td-id {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .td-name { font-weight: 500; }

        .cat-group-header {
            background: var(--surface-2);
        }
        .cat-group-header td {
            padding: 10px 16px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #a5b4fc;
            border-bottom: 1px solid var(--border);
            border-left: 3px solid var(--accent);
        }
        .cat-count {
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 8px;
        }

        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-ok { background: var(--green-dim); color: var(--green); }
        .badge-warn { background: var(--red-dim); color: var(--red); }

        .coverage-wrap { display: flex; align-items: center; gap: 10px; }
        .coverage-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            overflow: hidden;
            min-width: 60px;
        }
        .coverage-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .fill-green { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .fill-lime { background: linear-gradient(90deg, #84cc16, #65a30d); }
        .fill-orange { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .fill-red { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .coverage-pct {
            font-size: 0.78rem;
            font-weight: 600;
            min-width: 38px;
            text-align: right;
        }
        .pct-green { color: var(--green); }
        .pct-lime { color: #84cc16; }
        .pct-orange { color: var(--orange); }
        .pct-red { color: var(--red); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            .page { padding: 20px 12px 60px; }
            .hero { padding: 28px 20px; }
            .hero-title { font-size: 1.5rem; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            thead th, tbody td { padding: 8px 10px; font-size: 0.78rem; }
            .coverage-track { min-width: 40px; }
        }
    </style>
</head>
<body>
    <div class="page" id="app">
        <div class="hero">
            <div class="hero-title">EPG 频道信息</div>
            <div class="hero-sub">电子节目指南数据源 · 自动更新</div>
            <div class="hero-actions">
                <a href="epg.xml" download class="btn-dl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    EPG.xml
                </a>
                <a href="epg.xml.gz" download class="btn-dl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    EPG.xml.gz
                </a>
            </div>
            <div class="hero-urls">
                <div class="url-row"><span>XML</span> <code>{{ epgUrl }}</code></div>
                <div class="url-row"><span>GZ</span>&nbsp; <code>{{ epgGzUrl }}</code></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">频道总数</div>
                <div class="stat-value accent">{{ channels.length }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日无断层</div>
                <div class="stat-value green">{{ noGapCount }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日有断层</div>
                <div class="stat-value red">{{ gapCount }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">更新时间</div>
                <div class="stat-value" style="font-size:1rem;margin-top:4px">{{ updateTime }}</div>
            </div>
        </div>

        <div class="category-nav">
            <button class="cat-btn" :class="{ active: activeCategory === 'all' }" @click="activeCategory='all'">全部</button>
            <button class="cat-btn" :class="{ active: activeCategory === cat }" v-for="cat in availableCategories" :key="cat" @click="activeCategory=cat">{{ cat }}</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="center">#</th>
                        <th>频道ID</th>
                        <th>频道名</th>
                        <th class="center">最后节目</th>
                        <th class="center">今日断层</th>
                        <th>描述覆盖率</th>
                    </tr>
                </thead>
                <tbody>
                    <template v-for="(group, gIndex) in filteredGroups">
                        <tr class="cat-group-header" :key="'h'+gIndex">
                            <td colspan="6">{{ group.category }}<span class="cat-count">{{ group.channels.length }} 频道</span></td>
                        </tr>
                        <tr v-for="ch in group.channels" :key="ch.id">
                            <td class="td-index">{{ ch.globalIndex }}</td>
                            <td class="td-id">{{ ch.id }}</td>
                            <td class="td-name">{{ ch.name }}</td>
                            <td class="td-center">{{ ch.lastProgramTime }}</td>
                            <td class="td-center">
                                <span class="badge badge-warn" v-if="ch.hasGap">{{ ch.gapDetails }}</span>
                                <span class="badge badge-ok" v-else>无断层</span>
                            </td>
                            <td>
                                <div class="coverage-wrap">
                                    <div class="coverage-track">
                                        <div class="coverage-fill" :class="fillClass(ch.descriptionCoverage)" :style="{ width: ch.descriptionCoverage + '%' }"></div>
                                    </div>
                                    <span class="coverage-pct" :class="pctClass(ch.descriptionCoverage)">{{ ch.descriptionCoverage }}%</span>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr v-if="filteredGroups.length === 0">
                        <td colspan="6" class="empty-state">暂无频道数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                channels: [],
                updateTime: '',
                epgUrl: '',
                epgGzUrl: '',
                activeCategory: 'all'
            },
            computed: {
                noGapCount() { return this.channels.filter(c => !c.hasGap).length; },
                gapCount() { return this.channels.filter(c => c.hasGap).length; },
                groupedChannels() {
                    var order = ['央视', '卫视', '4K超高清', '付费', '国际', '省级', '市级', '县级', '其他'];
                    var groups = {};
                    order.forEach(function(c) { groups[c] = []; });
                    this.channels.forEach(function(ch, i) {
                        ch.globalIndex = i + 1;
                        var cat = ch.category || '其他';
                        if (!groups[cat]) groups[cat] = [];
                        groups[cat].push(ch);
                    });
                    return order.filter(function(c) { return groups[c] && groups[c].length > 0; })
                        .map(function(c) { return { category: c, channels: groups[c] }; });
                },
                availableCategories() {
                    return this.groupedChannels.map(function(g) { return g.category; });
                },
                filteredGroups() {
                    if (this.activeCategory === 'all') return this.groupedChannels;
                    return this.groupedChannels.filter(function(g) { return g.category === this.activeCategory; }.bind(this));
                }
            },
            mounted() {
                this.epgUrl = 'https://raw.githubusercontent.com/sumingyd/xml/main/epg.xml';
                this.epgGzUrl = 'https://raw.githubusercontent.com/sumingyd/xml/main/epg.xml.gz';
                this.loadEpgData();
            },
            methods: {
                loadEpgData() {
                    var ts = Date.now();
                    var self = this;
                    fetch('epg_data.json?t=' + ts)
                        .then(function(r) { return r.json(); })
                        .then(function(d) {
                            self.channels = d.channels;
                            self.updateTime = new Date(d.updateTime * 1000).toLocaleString();
                        })
                        .catch(function() {
                            fetch('https://raw.githubusercontent.com/sumingyd/xml/main/epg_data.json?t=' + ts)
                                .then(function(r) { return r.json(); })
                                .then(function(d) {
                                    self.channels = d.channels;
                                    self.updateTime = new Date(d.updateTime * 1000).toLocaleString();
                                })
                                .catch(function() { self.updateTime = new Date().toLocaleString(); });
                        });
                },
                fillClass(v) {
                    if (v >= 75) return 'fill-green';
                    if (v >= 50) return 'fill-lime';
                    if (v >= 25) return 'fill-orange';
                    return 'fill-red';
                },
                pctClass(v) {
                    if (v >= 75) return 'pct-green';
                    if (v >= 50) return 'pct-lime';
                    if (v >= 25) return 'pct-orange';
                    return 'pct-red';
                }
            }
        });
    </script>
</body>
</html>
