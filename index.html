<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPG频道信息</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface-2: #1a2236;
            --border: rgba(255,255,255,0.06);
            --text: #e2e8f0;
            --text-dim: #64748b;
            --accent: #6366f1;
            --green: #22c55e;
            --green-dim: rgba(34,197,94,0.12);
            --red: #ef4444;
            --red-dim: rgba(239,68,68,0.12);
            --orange: #f59e0b;
            --radius: 12px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .page { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }

        .hero {
            position: relative;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #0c1220 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -60px; left: 30%;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(34,197,94,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 28px; }
        .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
        .btn-dl {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem; font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
        }
        .btn-dl:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
        .btn-dl svg { width: 16px; height: 16px; }
        .hero-urls {
            margin-top: 20px;
            display: flex; flex-direction: column; gap: 6px;
            position: relative; z-index: 1;
        }
        .url-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; color: var(--text-dim);
        }
        .url-row code {
            background: rgba(99,102,241,0.1);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            user-select: all;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: border-color 0.2s;
        }
        .stat-card:hover { border-color: rgba(99,102,241,0.3); }
        .stat-label { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-value.accent { color: var(--accent); }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.qq { color: #a5b4fc; font-size: 1.3rem; }

        .filter-bar {
            display: flex; gap: 6px; flex-wrap: wrap;
            margin-bottom: 24px;
            align-items: center;
            max-height: 120px;
            overflow-y: auto;
        }
        .filter-bar .sep {
            width: 1px; height: 24px;
            background: var(--border);
            margin: 0 4px;
        }
        .cat-btn, .gap-btn {
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 0.78rem; font-weight: 500;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-btn:hover, .gap-btn:hover { border-color: var(--accent); color: var(--text); }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .gap-btn.active { background: var(--surface-2); border-color: var(--accent); color: #a5b4fc; }

        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--surface-2);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 2;
        }
        thead th.center { text-align: center; }
        tbody td {
            padding: 11px 16px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr { transition: background 0.15s; }
        tbody tr.row-data { cursor: pointer; }
        tbody tr.row-data:hover { background: rgba(99,102,241,0.06); }
        .td-center { text-align: center; }
        .td-index { color: var(--text-dim); font-size: 0.78rem; font-weight: 500; width: 50px; text-align: center; }
        .td-id { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.78rem; color: var(--text-dim); }
        .td-name { font-weight: 500; }
        .td-hint { font-size: 0.7rem; color: var(--text-dim); opacity: 0.6; margin-left: 6px; }

        .cat-group-header { background: var(--surface-2); }
        .cat-group-header td {
            padding: 10px 16px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #a5b4fc;
            border-bottom: 1px solid var(--border);
            border-left: 3px solid var(--accent);
        }
        .cat-count { font-weight: 400; color: var(--text-dim); margin-left: 8px; }

        .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge-ok { background: var(--green-dim); color: var(--green); }
        .badge-warn { background: var(--red-dim); color: var(--red); }

        .coverage-wrap { display: flex; align-items: center; gap: 10px; }
        .coverage-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; min-width: 60px; }
        .coverage-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
        .fill-green { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .fill-lime { background: linear-gradient(90deg, #84cc16, #65a30d); }
        .fill-orange { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .fill-red { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .coverage-pct { font-size: 0.78rem; font-weight: 600; min-width: 38px; text-align: right; }
        .pct-green { color: var(--green); }
        .pct-lime { color: #84cc16; }
        .pct-orange { color: var(--orange); }
        .pct-red { color: var(--red); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }

        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%; max-width: 640px; max-height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 48px rgba(0,0,0,0.4);
        }
        .modal-head {
            padding: 24px 28px 16px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .modal-title { font-size: 1.15rem; font-weight: 700; }
        .modal-cat { font-size: 0.78rem; color: #a5b4fc; margin-top: 4px; }
        .modal-close {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.5rem; cursor: pointer; padding: 0 4px; line-height: 1;
        }
        .modal-close:hover { color: var(--text); }
        .modal-meta {
            padding: 16px 28px;
            display: flex; gap: 20px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }
        .meta-item { font-size: 0.82rem; color: var(--text-dim); }
        .meta-item strong { color: var(--text); margin-right: 4px; }
        .modal-body { padding: 16px 28px 24px; overflow-y: auto; flex: 1; }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-track { background: transparent; }
        .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .gap-section { margin-bottom: 20px; }
        .gap-section-title { font-size: 0.82rem; font-weight: 600; color: var(--red); margin-bottom: 10px; }
        .gap-item { background: var(--red-dim); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; font-size: 0.82rem; color: var(--red); }
        .alias-section { margin-bottom: 20px; }
        .alias-title { font-size: 0.82rem; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; }
        .alias-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .alias-tag {
            background: rgba(99,102,241,0.1);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
        }
        .schedule-title { font-size: 0.82rem; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; }
        .sched-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
        .sched-item:last-child { border-bottom: none; }
        .sched-time { font-family: 'SF Mono', 'Fira Code', monospace; color: var(--accent); white-space: nowrap; min-width: 100px; }
        .sched-info { flex: 1; }
        .sched-name { font-weight: 500; color: var(--text); }
        .sched-desc { color: var(--text-dim); font-size: 0.78rem; margin-top: 3px; line-height: 1.4; }
        .sub-list { margin-top: 6px; padding-left: 12px; border-left: 2px solid rgba(99,102,241,0.2); }
        .sub-item { font-size: 0.76rem; color: var(--text-dim); padding: 2px 0; display: flex; gap: 8px; }
        .sub-time { font-family: 'SF Mono', 'Fira Code', monospace; color: rgba(99,102,241,0.6); white-space: nowrap; }
        .sub-title { color: var(--text-dim); }

        @media (max-width: 768px) {
            .page { padding: 20px 12px 60px; }
            .hero { padding: 28px 20px; }
            .hero-title { font-size: 1.5rem; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            thead th, tbody td { padding: 8px 10px; font-size: 0.78rem; }
            .coverage-track { min-width: 40px; }
            .modal { max-width: 100%; }
            .modal-head, .modal-meta, .modal-body { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hero">
            <div class="hero-title">EPG 频道信息</div>
            <div class="hero-sub">电子节目指南数据源 · 自动更新</div>
            <div class="hero-actions">
                <a href="https://github.com/sumingyd/xml/releases/latest/download/epg.xml" class="btn-dl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    EPG.xml
                </a>
                <a href="epg.xml.gz" download class="btn-dl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    EPG.xml.gz
                </a>
            </div>
            <div class="hero-urls">
                <div class="url-row"><span>XML</span> <code>https://github.com/sumingyd/xml/releases/latest/download/epg.xml</code></div>
                <div class="url-row"><span>GZ</span>&nbsp; <code>https://raw.githubusercontent.com/sumingyd/xml/main/epg.xml.gz</code></div>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="filter-bar" id="filterBar"></div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="center">#</th>
                        <th>频道ID</th>
                        <th>频道名</th>
                        <th class="center">最后节目</th>
                        <th class="center">今日节目</th>
                        <th class="center">今日断层</th>
                        <th>描述覆盖率</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="overlay" id="overlay" style="display:none">
            <div class="modal" id="modal"></div>
        </div>
    </div>

    <script>
        var CATEGORY_ORDER = ['央视', '卫视', '4K超高清', '付费', '国际', '港澳台', '北京', '天津', '上海', '重庆', '河北', '山西', '辽宁', '吉林', '黑龙江', '江苏', '浙江', '安徽', '福建', '江西', '山东', '河南', '湖北', '湖南', '广东', '海南', '四川', '贵州', '云南', '陕西', '甘肃', '青海', '内蒙古', '广西', '西藏', '宁夏', '新疆', '地方', '其他'];

        var state = {
            channels: [],
            activeCategory: 'all',
            gapFilter: 'all'
        };

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function fillClass(v) {
            if (v >= 75) return 'fill-green';
            if (v >= 50) return 'fill-lime';
            if (v >= 25) return 'fill-orange';
            return 'fill-red';
        }
        function pctClass(v) {
            if (v >= 75) return 'pct-green';
            if (v >= 50) return 'pct-lime';
            if (v >= 25) return 'pct-orange';
            return 'pct-red';
        }

        function groupedChannels() {
            var groups = {};
            CATEGORY_ORDER.forEach(function(c) { groups[c] = []; });
            state.channels.forEach(function(ch, i) {
                ch.globalIndex = i + 1;
                var cat = ch.category || '其他';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(ch);
            });
            return CATEGORY_ORDER.filter(function(c) { return groups[c].length > 0; })
                .map(function(c) { return { category: c, channels: groups[c] }; });
        }

        function renderStats() {
            var chs = state.channels;
            var hasProg = chs.filter(function(c) { return c.todaySchedule && c.todaySchedule.length > 0; }).length;
            var noGap = chs.filter(function(c) { return !c.hasGap; }).length;
            document.getElementById('stats').innerHTML =
                statCard('频道总数', esc(chs.length), 'accent') +
                statCard('今日有节目', esc(hasProg), 'green') +
                statCard('今日无节目', esc(chs.length - hasProg), '') +
                statCard('今日无断层', esc(noGap), 'green') +
                statCard('今日有断层', esc(chs.length - noGap), 'red') +
                statCard('QQ群', '757694351', 'qq') +
                statCard('更新时间', esc(state.updateTime), '', true);
        }
        function statCard(label, value, cls, small) {
            return '<div class="stat-card"><div class="stat-label">' + esc(label) + '</div>' +
                '<div class="stat-value ' + cls + '"' + (small ? ' style="font-size:1rem;margin-top:4px"' : '') + '>' + value + '</div></div>';
        }

        function renderFilterBar() {
            var cats = groupedChannels().map(function(g) { return g.category; });
            var html = '<button class="cat-btn' + (state.activeCategory === 'all' ? ' active' : '') + '" data-cat="all">全部</button>';
            cats.forEach(function(cat) {
                html += '<button class="cat-btn' + (state.activeCategory === cat ? ' active' : '') + '" data-cat="' + esc(cat) + '">' + esc(cat) + '</button>';
            });
            html += '<div class="sep"></div>';
            [['all', '全部频道'], ['ok', '无断层'], ['gap', '有断层']].forEach(function(p) {
                html += '<button class="gap-btn' + (state.gapFilter === p[0] ? ' active' : '') + '" data-gap="' + p[0] + '">' + p[1] + '</button>';
            });
            document.getElementById('filterBar').innerHTML = html;
        }

        function filteredGroups() {
            var gf = state.gapFilter;
            var groups = groupedChannels();
            if (state.activeCategory !== 'all') {
                groups = groups.filter(function(g) { return g.category === state.activeCategory; });
            }
            return groups.map(function(g) {
                var chs = g.channels;
                if (gf === 'ok') chs = chs.filter(function(c) { return !c.hasGap; });
                else if (gf === 'gap') chs = chs.filter(function(c) { return c.hasGap; });
                return { category: g.category, channels: chs };
            }).filter(function(g) { return g.channels.length > 0; });
        }

        function renderTable() {
            var groups = filteredGroups();
            var total = groups.reduce(function(s, g) { return s + g.channels.length; }, 0);
            var tbody = document.getElementById('tableBody');
            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">' + (state.channels.length ? '暂无匹配频道' : esc(state.updateTime)) + '</td></tr>';
                return;
            }
            var html = '';
            groups.forEach(function(g) {
                html += '<tr class="cat-group-header"><td colspan="7">' + esc(g.category) +
                    '<span class="cat-count">' + g.channels.length + ' 频道</span></td></tr>';
                g.channels.forEach(function(ch) {
                    html += '<tr class="row-data" data-id="' + esc(ch.id) + '">' +
                        '<td class="td-index">' + ch.globalIndex + '</td>' +
                        '<td class="td-id">' + esc(ch.id) + '</td>' +
                        '<td class="td-name">' + esc(ch.name) + '<span class="td-hint">点击查看详情</span></td>' +
                        '<td class="td-center">' + esc(ch.lastProgramTime) + '</td>' +
                        '<td class="td-center">' + (ch.todaySchedule ? ch.todaySchedule.length : 0) + '</td>' +
                        '<td class="td-center">' +
                            (ch.hasGap
                                ? '<span class="badge badge-warn">' + esc(ch.gapDetails) + '</span>'
                                : '<span class="badge badge-ok">无断层</span>') +
                        '</td>' +
                        '<td><div class="coverage-wrap">' +
                            '<div class="coverage-track"><div class="coverage-fill ' + fillClass(ch.descriptionCoverage) + '" style="width:' + ch.descriptionCoverage + '%"></div></div>' +
                            '<span class="coverage-pct ' + pctClass(ch.descriptionCoverage) + '">' + ch.descriptionCoverage + '%</span>' +
                        '</div></td></tr>';
                });
            });
            tbody.innerHTML = html;
        }

        function renderModal(ch) {
            var html = '<div class="modal-head"><div>' +
                '<div class="modal-title">' + esc(ch.name) + '</div>' +
                '<div class="modal-cat">' + esc(ch.category) + ' · ID: ' + esc(ch.id) + '</div></div>' +
                '<button class="modal-close" id="modalClose">&times;</button></div>' +
                '<div class="modal-meta">' +
                    '<div class="meta-item"><strong>最后节目</strong>' + esc(ch.lastProgramTime) + '</div>' +
                    '<div class="meta-item"><strong>描述覆盖</strong>' + ch.descriptionCoverage + '%</div>' +
                    '<div class="meta-item"><strong>今日断层</strong>' +
                        (ch.hasGap ? '<span style="color:var(--red)">' + esc(ch.gapDetails) + '</span>'
                                   : '<span style="color:var(--green)">无</span>') + '</div>' +
                    '<div class="meta-item"><strong>今日节目</strong>' + (ch.todaySchedule ? ch.todaySchedule.length : 0) + '个</div>' +
                '</div><div class="modal-body">';
            if (ch.aliases && ch.aliases.length) {
                html += '<div class="alias-section"><div class="alias-title">频道别名</div><div class="alias-list">';
                ch.aliases.forEach(function(a) { html += '<span class="alias-tag">' + esc(a) + '</span>'; });
                html += '</div></div>';
            }
            if (ch.gapList && ch.gapList.length) {
                html += '<div class="gap-section"><div class="gap-section-title">断层详情</div>';
                ch.gapList.forEach(function(g) {
                    html += '<div class="gap-item">' + esc(g.after) + ' → ' + esc(g.before) + '，间隔 ' + g.minutes + ' 分钟</div>';
                });
                html += '</div>';
            }
            html += '<div class="schedule-title">今日节目单</div>';
            (ch.todaySchedule || []).forEach(function(s) {
                html += '<div class="sched-item"><div class="sched-time">' + esc(s.start) + '-' + esc(s.stop) + '</div>' +
                    '<div class="sched-info"><div class="sched-name">' + esc(s.title) + '</div>' +
                    (s.desc ? '<div class="sched-desc">' + esc(s.desc) + '</div>' : '');
                if (s.subProgrammes && s.subProgrammes.length) {
                    html += '<div class="sub-list">';
                    s.subProgrammes.forEach(function(sub) {
                        html += '<div class="sub-item"><span class="sub-time">' + esc(sub.start) + '-' + esc(sub.stop) + '</span>' +
                            '<span class="sub-title">' + esc(sub.title) + '</span></div>';
                    });
                    html += '</div>';
                }
                html += '</div></div>';
            });
            html += '</div>';
            document.getElementById('modal').innerHTML = html;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('modalClose').onclick = closeModal;
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
        }

        function refresh() {
            renderStats();
            renderFilterBar();
            renderTable();
        }

        document.getElementById('filterBar').addEventListener('click', function(e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            if (btn.dataset.cat !== undefined) state.activeCategory = btn.dataset.cat;
            if (btn.dataset.gap !== undefined) state.gapFilter = btn.dataset.gap;
            renderFilterBar();
            renderTable();
        });

        document.getElementById('tableBody').addEventListener('click', function(e) {
            var row = e.target.closest('tr.row-data');
            if (!row) return;
            var id = row.getAttribute('data-id');
            var ch = state.channels.filter(function(c) { return String(c.id) === id; })[0];
            if (ch) renderModal(ch);
        });

        document.getElementById('overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        function loadEpgData() {
            var ts = Date.now();
            fetch('epg_data.json?t=' + ts)
                .then(function(r) { return r.json(); })
                .then(applyData)
                .catch(function() {
                    fetch('https://raw.githubusercontent.com/sumingyd/xml/main/epg_data.json?t=' + ts)
                        .then(function(r) { return r.json(); })
                        .then(applyData)
                        .catch(function() {
                            state.channels = [];
                            state.updateTime = '加载失败，请稍后刷新重试';
                            refresh();
                        });
                });
        }

        function applyData(d) {
            state.channels = d.channels;
            state.updateTime = new Date(d.updateTime * 1000).toLocaleString();
            refresh();
        }

        loadEpgData();
    </script>
</body>
</html>
